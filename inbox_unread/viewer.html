<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SHARED STREAM LOGS // DEVIL GUARD</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #00f3ff;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    /* 空白スクロール空間（無限スクロールの演出） */
    .scroll-space {
      height: 120vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .hint {
      color: #ff007f;
      font-size: 0.9rem;
      letter-spacing: 2px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    /* ログの滑らかスクロールコンテナ */
    .stream-container {
      max-width: 800px;
      margin: 0 auto 200px auto;
      padding: 20px;
      background: rgba(15, 20, 30, 0.8);
      border: 1px solid #00f3ff;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }
    .log-item {
      padding: 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.1);
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: slideIn 0.5s forwards ease-out;
    }
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .log-time { color: #ff007f; margin-right: 10px; }
    .log-user { color: #ffe600; font-weight: bold; margin-right: 10px; }
    .log-msg  { color: #ffffff; }
  </style>
</head>
<body>

  <!-- スクロールを誘導する広大な余白空間 -->
  <div class="scroll-space">
    <h1>/// STREAM LOG ARCHIVE ///</h1>
    <p class="hint">▼ SCROLL DOWN TO REVEAL SHARED LOGS ▼</p>
  </div>

  <!-- 滑らかに表示されるログ本体 -->
  <div class="stream-container" id="logContainer">
    <div style="color: #00f3ff; text-align: center; margin-bottom: 15px;">[ DEVIL GUARD ACTIVE // 404 PROTECTED ]</div>
    <!-- ログがここに滑らかに挿入される -->
  </div>

</body>
</html>
