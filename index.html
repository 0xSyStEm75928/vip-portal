<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP PORTAL | SILENT STAND</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: #121318;
      --accent: #d4af37;
      --text: #e0e0e0;
      --border: rgba(212, 175, 55, 0.3);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px; width: 100%; max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      box-sizing: border-box;
    }
    h1 { font-size: 1.5rem; color: var(--accent); margin-top: 0; text-align: center; letter-spacing: 2px; }
    .badge {
      display: inline-block; background: rgba(212,175,55,0.1); color: var(--accent);
      padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; border: 1px solid var(--border);
      margin-bottom: 20px; width: fit-content;
    }
    .info-box {
      background: rgba(0,0,0,0.4); border-radius: 8px; padding: 12px; margin-bottom: 15px;
      font-size: 0.85rem; word-break: break-all; border-left: 3px solid var(--accent);
    }
    .label { color: #888; font-size: 0.75rem; margin-bottom: 4px; }
    .btn {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #d4af37, #aa820a);
      border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer;
      font-size: 1rem; transition: 0.2s; margin-top: 10px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .status { margin-top: 15px; font-size: 0.85rem; text-align: center; color: #aaa; }
  </style>
</head>
<body>

  <div class="card">
    <div style="text-align: center;"><span class="badge">VIP EXCLUSIVE PROTOCOL</span></div>
    <h1>SILENT STAND</h1>

    <div class="info-box">
      <div class="label">DEPLOYED CONTRACT</div>
      <div id="contractAddr">0x1255d17c1bc2f764d087536410879f2d0d8772fd</div>
    </div>

    <div class="info-box">
      <div class="label">CONNECTED OWNER</div>
      <div id="userAddr">未接続 (ウォレットを接続してください)</div>
    </div>

    <div class="info-box">
      <div class="label">LEGAL & ON-CHAIN STATUS</div>
      <div id="legalStatus">未同期 (アクティベート待ち)</div>
    </div>

    <button class="btn" onclick="connectAndVerify()">ウォレット接続 & オンチェーン確認</button>
    
    <div class="status" id="logMsg">システムの応答を待機中...</div>
  </div>

  <script>
    const TARGET_CONTRACT = "0x1255d17c1bc2f764d087536410879f2d0d8772fd";

    async function connectAndVerify() {
      const log = document.getElementById('logMsg');
      if (window.ethereum) {
        try {
          log.innerText = "ウォレットに接続中...";
          const provider = new ethers.providers.Web3Provider(window.ethereum);
          await provider.send("eth_requestAccounts", []);
          const signer = provider.getSigner();
          const address = await signer.getAddress();

          document.getElementById('userAddr').innerText = address;
          
          log.innerText = "オンチェーン状態の検証中...";
          
          // トラフィック・法的所有権の模擬確定チェック
          setTimeout(() => {
            document.getElementById('legalStatus').innerText = "✅ 確定済み (所有権有効 / 返金不可)";
            document.getElementById('legalStatus').style.color = "#4CAF50";
            log.innerText = "アクセス認証完了。オンチェーン同期済み。";
          }, 1000);

        } catch (err) {
          log.innerText = "エラー: " + err.message;
 }
      } else {
        log.innerText = "MetamaskなどのWeb3ウォレットブラウザで開いてください。";
      }
    }
  </script>
</body>
</html>
