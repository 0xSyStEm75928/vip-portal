<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BELPHEGOR MEV ENGINE</title>
    <style>
        body { background: #0d0e12; color: #d1d5db; font-family: monospace; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2d3d; padding-bottom: 15px; }
        .card { background: #161821; border: 1px solid #2a2d3d; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .green { color: #00ff88; font-size: 2rem; font-weight: bold; }
        .btn { background: #00ff88; color: #0d0e12; border: none; padding: 10px 18px; font-weight: bold; font-family: monospace; border-radius: 4px; cursor: pointer; }
        .btn-fire { background: #ff4a4a; color: #fff; width: 100%; padding: 15px; font-size: 1.2rem; margin-top: 10px; display: none; }
        .btn:hover { background: #00cc6a; }
        .log { background: #050508; border: 1px solid #1f2230; padding: 10px; height: 180px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ BELPHEGOR MEV ENGINE</h1>
        <button id="connectBtn" class="btn" onclick="connectWallet()">CONNECT RABBY</button>
    </div>

    <div class="card">
        <h2>CONNECTED WALLET</h2>
        <div id="walletAddr" style="color: #8b949e;">Not Connected</div>
    </div>

    <div class="card">
        <h2>GHOST SPREAD (REALTIME)</h2>
        <div id="sp" class="green">0.000%</div>
        <button id="fireBtn" class="btn btn-fire" onclick="executeFlashLoan()">🔥 READY TO FIRE (BASE NET)</button>
    </div>

    <div class="card">
        <h2>MEV PRIVATE MEMPOOL MONITOR</h2>
        <div id="log" class="log"></div>
    </div>

    <script>
        let currentAccount = null;

        function formatAddress(addr) {
            return addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
        }

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    currentAccount = accounts[0];
                    document.getElementById("walletAddr").innerText = formatAddress(currentAccount);
                    document.getElementById("walletAddr").style.color = "#00ff88";
                    document.getElementById("connectBtn").innerText = "RABBY CONNECTED";
                } catch (err) {
                    alert("接続が拒否されました");
                }
            } else {
                alert("Rabbyウォレットが検出されません。");
            }
        }

        // 🔥 Baseチェーン本番用 Aave V3 Pool アドレスへ書き換え
        async function executeFlashLoan() {
            if (!currentAccount) {
                alert("先にRabbyウォレットを接続してください。");
                return;
            }

            // ★ Base メインネット (ChainId: 8453) の Aave V3 Pool アドレス
            const BASE_AAVE_V3_POOL = "0xA238Dd80C259a72e81d7e4664a9801593F98d1c5";

            try {
                const txHash = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: currentAccount,
                        to: BASE_AAVE_V3_POOL,
                        value: '0x0',
                        data: '0x', // このテストでは接続疎通のみ確認
                    }],
                });
                console.log("TxHash:", txHash);
            } catch (error) {
                console.log("キャンセルまたはシミュレーション表示確認:", error);
            }
        }

        async function checkMev() {
            const a = (1.000 + Math.random() * 0.002).toFixed(4);
            const b = (1.002 + Math.random() * 0.006).toFixed(4);
            try {
                const res = await fetch("/api/mev-bundle", {
                    method: "POST",
            headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dex_a_price: a, dex_b_price: b, account: currentAccount })
                });
                const data = await res.json();
                document.getElementById("sp").innerText = data.spread_pct + "%";
                const log = document.getElementById("log");
                const time = new Date().toLocaleTimeString();
                const fireBtn = document.getElementById("fireBtn");

                if (data.is_ghost_spread) {
                    log.innerHTML = `<div>[${time}] <span style="color:#00ff88">⚡ [GHOST SPREAD] Opportunity Detected! (${data.spread_pct}%)</span></div>` + log.innerHTML;
                    fireBtn.style.display = "block";
                } else {
                    log.innerHTML = `<div>[${time}] 💤 Normal noise (${data.spread_pct}%). Monitoring...</div>` + log.innerHTML;
                    fireBtn.style.display = "none";
                }
            } catch (e) {}
        }
        setInterval(checkMev, 3000);
    </script>
</body>
</html>
