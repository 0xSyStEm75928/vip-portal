<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELPHEGOR // FLASH ARBITRAGE TERMINAL</title>
    <!-- Ethers.js ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { background: #08090c; color: #e1e4e8; font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff88; padding-bottom: 15px; }
        .card { background: #111318; border: 1px solid #21262d; border-radius: 8px; padding: 18px; margin-top: 15px; }
        .green { color: #00ff88; font-weight: bold; }
        .title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #8b949e; border-bottom: 1px solid #21262d; padding-bottom: 5px; }
        .btn { background: #00ff88; color: #08090c; border: none; padding: 10px 20px; font-weight: bold; font-family: monospace; border-radius: 4px; cursor: pointer; }
        .btn-fire { background: #ff3366; color: #fff; width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; margin-top: 15px; display: none; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #00cc6a; }
        .log { background: #030405; border: 1px solid #161b22; padding: 12px; height: 200px; overflow-y: auto; margin-top: 10px; font-size: 0.85rem; word-break: break-all; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .val { font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>⚡ FLASH ARBITRAGE TERMINAL</h2>
        <button id="connectBtn" class="btn" onclick="connectWallet()">CONNECT WALLET</button>
    </div>

    <div class="card">
        <div class="title">TARGET CHAIN & WALLET</div>
        <div>CHAIN: <span class="green">Polygon Mainnet (137)</span></div>
        <div style="margin-top: 5px;">WALLET: <span id="walletAddr" style="color: #8b949e;">Not Connected</span></div>
    </div>

    <div class="card">
        <div class="title">ARBITRAGE MONITOR (QuickSwap ➔ SushiSwap)</div>
        <div class="grid">
            <div>
                <div style="font-size:0.8rem; color:#8b949e;">SPREAD</div>
                <div id="spreadVal" class="val green">0.00%</div>
            </div>
            <div>
                <div style="font-size:0.8rem; color:#8b949e;">ESTIMATED PROFIT</div>
                <div id="profitVal" class="val" style="color:#00e1ff;">$0.00</div>
            </div>
        </div>
        <button id="fireBtn" class="btn-fire" onclick="executeFlashLoan()">🔥 EXECUTE FLASH ARBITRAGE (RABBY)</button>
    </div>

    <div class="card">
        <div class="title">CALLDATA & EXECUTION LOG</div>
        <div id="log" class="log"></div>
    </div>

    <script>
        let currentAccount = null;

        // Polygon 本番ターゲットアドレス
        const POLYGON_AAVE_V3_POOL = "0x794a61358D6845594F94dc1DB02A252b5b4814aD";
        const POLYGON_USDC = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359";

        // Aave V3 flashLoanSimple の標準ABI
        const AAVE_ABI = [
            "function flashLoanSimple(address receiverAddress, address asset, uint256 amount, bytes params, uint16 referralCode)"
        ];

        function formatAddress(addr) {
            return addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
        }

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    currentAccount = accounts[0];
                    document.getElementById("walletAddr").innerText = formatAddress(currentAccount);
                    document.getElementById("walletAddr").style.color = "#00ff88";
                    document.getElementById("connectBtn").innerText = "CONNECTED";
                    addLog("Wallet connected: " + currentAccount);
                } catch (err) {
                    alert("接続が拒否されました");
                }
            } else {
                alert("RabbyなどのWeb3ウォレットが見つかりません");
            }
        }

        function addLog(msg) {
            const log = document.getElementById("log");
            const time = new Date().toLocaleTimeString();
            log.innerHTML = `<div>[${time}] ${msg}</div>` + log.innerHTML;
        }

        // 🔥 Aave V3 フラッシュローン用の CallData 生成・送信処理
        async function executeFlashLoan() {
            if (!currentAccount) {
                alert("先にウォレットを接続してください。");
                return;
            }

            try {
                // Ethers.js を使って完全な CallData をエンコード
                const iface = new ethers.utils.Interface(AAVE_ABI);
                const loanAmount = ethers.utils.parseUnits("1000", 6); // 1,000 USDCを借りる

                const callData = iface.encodeFunctionData("flashLoanSimple", [
                    currentAccount, // フラッシュローン実行/受取先
                    POLYGON_USDC,   // 借りるトークン (USDC)
                    loanAmount,     // 金額
                    "0x",           // パラメータ
                    0               // リファラルコード
                ]);

                addLog(`<span style="color:#00e1ff;">[CallData Generated]: ${callData.substring(0, 42)}...</span>`);

                // Rabby へ送るパラメータ（data にしっかり入る）
                const txParams = {
                    from: currentAccount,
                    to: POLYGON_AAVE_V3_POOL,
                    value: "0x0",
                    data: callData
                };

                // Rabby ポップアップ起動
                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [txParams],
                });

            } catch (error) {
                addLog(`<span style="color:#ff3366;">[Transaction Status]: ${error.message || "User cancelled or simulated"}</span>`);
            }
        }

        // 模擬価格差（スプレッド）監視ロジック
        function monitorArbitrage() {
            // 0.05% 〜 0.40% のスプレッドをランダム生成
            const spread = (0.05 + Math.random() * 0.35).toFixed(2);
            document.getElementById("spreadVal").innerText = spread + "%";

            const fireBtn = document.getElementById("fireBtn");
            const profitVal = document.getElementById("profitVal");

            // スプレッドが 0.20% を超えたらアビトラチャンス（発火ボタン出現）
            if (parseFloat(spread) >= 0.20) {
                const estProfit = (1000 * (spread / 100)).toFixed(2);
                profitVal.innerText = "+$" + estProfit;
                fireBtn.style.display = "block";
                addLog(`<span style="color:#00ff88;">⚡ [ARBITRAGE CHANCE] Spread: ${spread}% | Est Profit: +$${estProfit}</span>`);
            } else {
                profitVal.innerText = "$0.00";
                fireBtn.style.display = "none";
            }
        }

        setInterval(monitorArbitrage, 3000);
    </script>
</body>
</html>
