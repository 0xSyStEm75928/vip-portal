name: Validate and Post Comment

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to validate'
        required: false
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  validate-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run validation (produce /tmp/validate-output.txt but do not fail the job)
        id: validate
        continue-on-error: true
        run: |
          mkdir -p /tmp
          # ここに実際の発行検証コマンドを配置。今回はモック結果を出力します
          echo "✗ 2 issue(s) found:" > /tmp/validate-output.txt
          echo "" >> /tmp/validate-output.txt
          echo "  • **Banner Image** is missing — go to https://gitcoin.co/generator" >> /tmp/validate-output.txt

      - name: Post validation comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- validate-issue-bot -->';
            const issueNumber = process.env.ISSUE_NUMBER ? parseInt(process.env.ISSUE_NUMBER, 10) : (context.issue && context.issue.number);
            if (!issueNumber) return console.log('No issue found; skipping.');
            
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('/tmp/validate-output.txt', 'utf8').trim();
            } catch (e) {
              output = '⚠️ Validation output missing.';
            }
            
            const body = `${marker}\n## ❌ Content Validation Issues\n\n\`\`\`\n${output}\n\`\`\``;
            
            (async () => {
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                const existing = comments.find(c => c.body?.includes(marker));
                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id
                  });
                }
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body
                });
                console.log('Comment successfully posted/updated!');
              } catch (err) {
                console.warn('API operation failed but swallowed:', err.message);
              }
            })();
