name: Validate and Post Comment

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to validate'
        required: false
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  validate-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 相手の指摘通り、continue-on-error: true をつけて、バリデータ自身がコケても確実に次に繋ぐ
      - name: Run validation (produce /tmp/validate-output.txt)
        id: validate
        continue-on-error: true
        run: |
          mkdir -p /tmp
          # ここで検証を実行。今回はテスト用の出力を生成します
          echo "### ⚠️ バリデーション結果" > /tmp/validate-output.txt
          echo "バナー画像が不足しています。https://gitcoin.co/generator で生成してください。" >> /tmp/validate-output.txt

      # 2. 相手が提示してくれた「最も確実なトークン引き渡し＆自動クリーンアップ付き」のスクリプトでコメントを投稿
      - name: Post validation comment (safe async IIFE)
        uses: actions/actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const marker = '<!-- validate-issue-bot -->';
          const issueNumber = process.env.ISSUE_NUMBER ? parseInt(process.env.ISSUE_NUMBER, 10) : (context.issue && context.issue.number);
          if (!issueNumber) return console.log('No issue found; skipping.');
          
          const fs = require('fs');
          const output = (() => { 
            try { 
              return fs.readFileSync('/tmp/validate-output.txt', 'utf8').trim(); 
            } catch(e) { 
              return ''; 
            } 
          })();
          
          const body = output 
            ? `${marker}\n${output}`
            : `${marker}\n⚠️ No validate output found.`;
          
          (async () => {
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              
              const existing = comments.find(c => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id
                });
              }
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
              console.log('Comment posted.');
            } catch (e) {
              console.warn('GitHub API error (swallowed):', e && e.message ? e.message : e);
            }
          })();
