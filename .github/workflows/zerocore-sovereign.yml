name: ZeroCore Sovereign Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  zerocore-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Verification Tools
      run: |
        sudo apt update
        sudo apt install -y jq python3-pip
        pip install jsonschema

    - name: Validate Pipeline Contract (jq)
      run: |
        jq empty zerocore.pipeline.json

    - name: Validate Repository JSON Integrity
      run: |
        find . -name "*.json" -not -path "*/.*" -exec jq empty {} \;

    - name: Validate Schema Compliance
      run: |
        jsonschema \
        -i zerocore.sovereign.bootstrap.v1.json \
        schemas/zerocore.sovereign.bootstrap.schema.json

    - name: Execute Sovereign Runtime Check
      run: |
        chmod +x Validator/zerocore_validate.sh
        ./Validator/zerocore_validate.sh

    - name: Generate Audit Evidence
      run: |
        mkdir -p Evidence
        sha256sum zerocore.pipeline.json > Evidence/github.audit.jsonl

    - name: Upload Sovereign Proof Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zerocore-proof
        path: Evidence/
